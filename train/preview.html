=\"badge mode-pure\">PURE</span><span class=\"meta-note\">window 1536 bytes</span><span class=\"meta-segments\">segments: TEXT <span class=\"meta-length\">(1536 B)</span></span></div><details class=\"meta-section\" open><summary>Source Contributions</summary><table class=\"meta-table\"><thead><tr><th>Origin</th><th>Language</th><th>Span</th><th>Source</th><th>Notes</th></tr></thead><tbody><tr><td>Base</td><td>TEXT</td><td>0-1536<br>1536 B</td><td class=\"meta-source\">41bcecc5dafdede20168c69d8b16a3f0</td><td></td></tr></tbody></table></details></div><div class=\"example-legend\"><span class=\"chip\" style=\"background: #db5656;\" title=\"ID: 14\">TEXT</span></div><span class=\"tok\" style=\"background:rgba(219, 86, 86, 0.15);\" title=\"TEXT\">Rinc\ufffd\ufffdn Taurino por Jos\ufffd\ufffd Daniel Rojo: Rinc\ufffd\ufffdn Taurino vuelve a los ruedos!! Volvemos. O vuelvo: como prefieran. Lo hago con el convencimiento de seguir aportando apuntes taurinos al panorama 2008. Problemas con internet me apartaron, all\ufffd\ufffd por el mes de diciembre, al dique seco. Muy en contra de mi voluntad tuve que dejar de aportar mi granito de arena a la blogesfera taurina. Ahora, totalmente recuperado y en plenas facultades internautas puedo decir, a boca llena, que vuelvo. Lo hago con la misma intenci\ufffd\ufffdn y el id\ufffd\ufffdntico objetivo que con el que abr\ufffd\ufffd plaza en aquel momento, (Julio 2008): contar y hacer llegar a quien pasara por esta p\ufffd\ufffdgina, mi particular visi\ufffd\ufffdn sobre el apasionante mundo del toro. Con la verdad, que duda cabe. Esa ha sido mi mejor aliada durante todo este tiempo. Siempre me han inculcado que con la verdad se llega a todas partes y tambi\ufffd\ufffdn que se pilla antes a un mentiroso que a un cojo. Tal vez por ese motivo nunca me arrepent\ufffd\ufffd ni me arrepentir\ufffd\ufffd jam\ufffd\ufffds de los escrito en este ruedo de oro. Espero no defraudar a los \ufffd\ufffdenganchados\ufffd\ufffd ya a este espacio y asimismo espero \ufffd\ufffdenganchar o atrapar\ufffd\ufffd a los nuevos aficionados que bien busc\ufffd\ufffdndolo, o bien por casualidad hayan ca\ufffd\ufffddo en las redes de este rinc\ufffd\ufffdn taurino. Con ese esp\ufffd\ufffdritu y ese deseo, el mismo de siempre, vuelvo. Publicado por Jos\ufffd\ufffd Daniel Rojo en 22:14 Querido amigo, \ufffd\ufffdgracias por volver! Se te ha echado de menos. Faltaba tu blog. \ufffd\ufffdCon lo que se nos est\ufffd\ufffd viniendo encima! M\ufffd\ufffdndame tu nuevo email. Encantado de que vuelvas Jos\ufffd\ufffd Dani</span>","<div class=\"stats muted\">valid_len=1191, class_dist=[svg:1191]</div><div class=\"meta\"><div class=\"meta-mode\"><span class=\"badge mode-pure\">PURE</span><span class=\"meta-note\">window 1536 bytes</span><span class=\"meta-segments\">segments: SVG <span class=\"meta-length\">(1191 B)</span></span></div><details class=\"meta-section\" open><summary>Source Contributions</summary><table class=\"meta-table\"><thead><tr><th>Origin</th><th>Language</th><th>Span</th><th>Source</th><th>Notes</th></tr></thead><tbody><tr><td>Base</td><td>SVG</td><td>0-1191<br>1191 B</td><td class=\"meta-source\">046bbc8f775790cf5d1671154c9c744d</td><td></td></tr></tbody></table></details></div><div class=\"example-legend\"><span class=\"chip\" style=\"background: #db5656;\" title=\"ID: 29\">SVG</span></div><span class=\"tok\" style=\"background:rgba(219, 86, 86, 0.15);\" title=\"SVG\">=&quot;100%&quot; style=&quot;stop-color:#6da5b7&quot;/&gt;\n  &lt;/linearGradient&gt;\n  &lt;linearGradient id=&quot;60spsycho&quot; x1=&quot;0%&quot; x2=&quot;0%&quot; y1=&quot;0%&quot; y2=&quot;100%&quot;&gt;\n   &lt;stop offset=&quot;0%&quot; style=&quot;stop-color:#df5940&quot;/&gt;\n   &lt;stop offset=&quot;25%&quot; style=&quot;stop-color:#d8d15f&quot;/&gt;\n   &lt;stop offset=&quot;50%&quot; style=&quot;stop-color:#e9882a&quot;/&gt;\n   &lt;stop offset=&quot;100%&quot; style=&quot;stop-color:#279362&quot;/&gt;\n  &lt;/linearGradient&gt;\n  &l
