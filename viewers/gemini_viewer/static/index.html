<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gemini Ground Truth Viewer</title>
  <link rel="stylesheet" href="static/style.css?v=4">
</head>
<body>
  <header class="topbar">
    <div class="branding">
      <span class="brand-primary">Gemini</span>
      <span class="brand-secondary">Ground Truth</span>
    </div>
    <div class="topbar-meta">
      <span id="snapshotDirectory"></span>
      <span id="snapshotStats"></span>
    </div>
  </header>

  <main class="layout">
    <aside class="runs-panel">
      <div class="panel-heading">
        <div>
          <h2>Content Types</h2>
          <p><strong id="typeCount">0</strong> types across <strong id="fileCount">0</strong> files.</p>
        </div>
      </div>
      <div id="typesList" class="runs-list types-list">
        <div class="placeholder">Loading content types…</div>
      </div>
    </aside>

    <section class="detail-panel" id="detailPanel">
      <div class="detail-placeholder">
        Select a content type to view a random sample of that segment.
      </div>
    </section>
  </main>

  <template id="typeCardTemplate">
    <article class="type-card">
      <div class="type-card-header">
        <div class="type-color"></div>
        <div class="type-name"></div>
      </div>
      <div class="type-card-meta">
        <div>
          <span class="label">Files</span>
          <span class="value type-card-files"></span>
        </div>
        <div>
          <span class="label">Folder</span>
          <span class="value type-card-segments"></span>
        </div>
      </div>
    </article>
  </template>

  <script src="static/app.js?v=4"></script>
</body>
</html>
