[project]
name = "text-segmenter"
version = "0.1.0"
description = "Byte-wise HTML/CSS/JS segmentation with JAX/Flax"
readme = "README.md"
requires-python = "~=3.11.0"

dependencies = [
    "datasets==3.6.0",      # uses map/filter/shuffle with num_proc
    "flax>=0.11.2",
    "optax>=0.2.5",
    "numpy>=1.26",          # JAX works well with >=1.26; NumPy 2.x also fine on recent JAX
    "pyarrow>=12",          # datasets backend
    "msgpack>=1.0.5",
    # --- JAX setup ---
    # Cross-platform CPU JAX:
    #   - On all platforms, install JAX 0.8.1 (has wheels on Windows, Linux, macOS).
    #   - jaxlib is pinned to the same version; wheels exist for win_amd64 + manylinux.
    "jax==0.8.1",
    "jaxlib==0.8.1",
    # Extra GPU support only on Linux (CUDA 13):
    # These wheels are Linux-only (manylinux_x86_64/aarch64), so we guard them.
    #'jax-cuda13-plugin[with-cuda]==0.8.1; platform_system == "Linux"',
    #'jax-cuda13-pjrt==0.8.1; platform_system == "Linux"',
    "orbax-checkpoint>=0.6.0",
    "tensorstore>=0.1.67",
    "wandb==0.21.4",
    "fastapi==0.116.2",
    "uvicorn==0.35.0",
    "matplotlib==3.10.6",
    "magika==0.6.2",
    "psutil==7.1.3",
    "google-genai>=1.64.0",
    "python-dotenv>=1.2.1",
]

#[project.optional-dependencies]
#gpu = [
#    "jax[cuda12]>=0.4.30",
#]

[project.scripts]
seg-train = "u_net:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."] 
include = ["activate", "segment_viewer"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[[tool.uv.index]]
url = "https://us-python.pkg.dev/ml-oss-artifacts-published/jax/simple/"
